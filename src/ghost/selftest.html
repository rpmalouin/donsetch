<!doctype html>
<!-- DonGhost fingerprint self-test. Results are written to
     document.title + body text as JSON : read back over the
     DOM domain, no Runtime.evaluate ever. -->
<html>
<head><meta charset="utf-8"><title>pending</title></head>
<body>pending</body>
<script>
(async () => {
  const out = {};
  // Real-Chrome parity: the property must be FALSE through the
  // native prototype accessor, with NO own property on the
  // navigator instance (an injected own property is itself the
  // tell). Since Chrome 89 every engine exposes webdriver=false
  // by default, so a literal false IS the clean signature.
  out.webdriver = navigator.webdriver;
  out.webdriverOwnProp = Object.getOwnPropertyNames(navigator).includes('webdriver');
  out.ua = navigator.userAgent;
  out.screen = [screen.width, screen.height];
  out.window = [innerWidth, innerHeight];
  out.outerWindow = [outerWidth, outerHeight];
  out.dpr = devicePixelRatio;
  out.colorDepth = screen.colorDepth;
  out.hwc = navigator.hardwareConcurrency;
  out.mem = navigator.deviceMemory ?? null;
  out.touch = navigator.maxTouchPoints;
  out.platform = navigator.platform;
  out.langs = navigator.languages;
  out.plugins = navigator.plugins.length;
  out.hasChrome = !!window.chrome;
  out.tzOffset = new Date().getTimezoneOffset();
  out.tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  out.notification = typeof Notification !== "undefined" ? Notification.permission : "n/a";
  try {
    const ua = navigator.userAgentData;
    if (ua) {
      const hi = await ua.getHighEntropyValues(["platformVersion", "model"]);
      out.uaData = { brands: ua.brands.map(b => b.brand + " " + b.version), mobile: ua.mobile, platform: ua.platform, platformVersion: hi.platformVersion };
    } else out.uaData = null;
  } catch (e) { out.uaData = "err"; }
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl");
    const ext = gl.getExtension("WEBGL_debug_renderer_info");
    out.webglVendor = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : "?";
    out.webglRenderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "?";
  } catch (e) { out.webglVendor = "err"; out.webglRenderer = "err"; }
  const json = JSON.stringify(out);
  document.body.textContent = json;
  document.title = json;
})();
</script>
</html>
